<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Fixtures — Market Cross Darts League</title>
<link rel="stylesheet" href="../assets/social.css">
</head>
<body>

<div class="err-banner" id="errBanner"></div>
<div class="toolbar">
  <a href="../index.html">← Back to site</a>
  <button class="btn" id="downloadBtn" disabled>Download image</button>
</div>

<div id="captureCard">
  <div class="card-header">
    <div class="league">Market Cross Darts League</div>
    <h2>Upcoming Fixtures</h2>
    <div class="sub" id="cardSub">Loading…</div>
  </div>
  <div class="card-body" id="cardBody"><p class="empty">Loading…</p></div>
</div>

<script src="../assets/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function diffDays(fromISO, toISO) {
  return Math.round((new Date(toISO + 'T00:00:00') - new Date(fromISO + 'T00:00:00')) / 86400000);
}

loadLeagueData().then(data => {
  const upcoming = data.fixtures
    .filter(f => f.status !== 'Submitted' && diffDays(data.today, f.dateISO) >= 0 && diffDays(data.today, f.dateISO) <= 7)
    .sort((a, b) => a.dateISO.localeCompare(b.dateISO));

  document.getElementById('cardSub').textContent = upcoming.length
    ? `${upcoming[0].date} – ${upcoming[upcoming.length - 1].date}`
    : 'Nothing scheduled in the next 7 days';

  const body = document.getElementById('cardBody');
  body.innerHTML = upcoming.length
    ? upcoming.map(f => `
      <div class="row">
        <div>
          <div class="teams">${escapeHtml(f.homeTeam)} v ${escapeHtml(f.awayTeam)}</div>
        </div>
        <div class="date" style="font-size:14px; font-weight:600;">${escapeHtml(f.date)}</div>
      </div>`).join('')
    : '<p class="empty">No fixtures to show.</p>';

  document.getElementById('downloadBtn').disabled = false;
}).catch(showPageError);

document.getElementById('downloadBtn').addEventListener('click', () => {
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true; btn.textContent = 'Generating…';
  html2canvas(document.getElementById('captureCard'), { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'mcdl-upcoming-fixtures.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.disabled = false; btn.textContent = 'Download image';
  });
});
</script>
</body>
</html>
