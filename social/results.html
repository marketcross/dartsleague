<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Results — Market Cross Darts League</title>
<link rel="stylesheet" href="../assets/social.css">
</head>
<body>

<div class="err-banner" id="errBanner"></div>
<div class="toolbar">
  <a href="../index.html">← Back to site</a>
  <button class="btn" id="downloadBtn" disabled>Download image</button>
</div>

<div id="captureCard">
  <div class="card-header">
    <div class="league">Market Cross Darts League</div>
    <h2 id="cardTitle">This Week's Results</h2>
    <div class="sub" id="cardSub">Loading…</div>
  </div>
  <div class="card-body" id="cardBody"><p class="empty">Loading…</p></div>
  <div class="card-highlights hidden" id="cardHighlights"></div>
</div>

<script src="../assets/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function diffDays(fromISO, toISO) {
  return Math.round((new Date(toISO + 'T00:00:00') - new Date(fromISO + 'T00:00:00')) / 86400000);
}

loadLeagueData().then(data => {
  const results = data.fixtures
    .filter(f => f.status === 'Submitted' && diffDays(f.dateISO, data.today) >= 0 && diffDays(f.dateISO, data.today) <= 7)
    .sort((a, b) => b.dateISO.localeCompare(a.dateISO));

  document.getElementById('cardSub').textContent = results.length
    ? `${results[results.length - 1].date} – ${results[0].date}`
    : 'No results in the last 7 days';

  const body = document.getElementById('cardBody');
  body.innerHTML = results.length
    ? results.map(f => `
      <div class="row">
        <div>
          <div class="teams">${escapeHtml(f.homeTeam)} v ${escapeHtml(f.awayTeam)}</div>
          <div class="date">${escapeHtml(f.date)}</div>
        </div>
        <div class="score">${f.homePoints}–${f.awayPoints}</div>
      </div>`).join('')
    : '<p class="empty">No results to show.</p>';

  const highlightsEl = document.getElementById('cardHighlights');
  const highlightsMarkup = highlightsHtml(weeklyHighlights(results));
  if (highlightsMarkup) {
    highlightsEl.innerHTML = '<div class="highlights-label">180s &amp; Finishes</div>' + highlightsMarkup;
    highlightsEl.classList.remove('hidden');
  } else {
    highlightsEl.classList.add('hidden');
  }

  document.getElementById('downloadBtn').disabled = false;
}).catch(showPageError);

document.getElementById('downloadBtn').addEventListener('click', () => {
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true; btn.textContent = 'Generating…';
  html2canvas(document.getElementById('captureCard'), { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'mcdl-results.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.disabled = false; btn.textContent = 'Download image';
  });
});
</script>
</body>
</html>
