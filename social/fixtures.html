<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Fixtures — Market Cross Darts League</title>
<link rel="stylesheet" href="../assets/social.css">
</head>
<body>

<div class="err-banner" id="errBanner"></div>
<div class="toolbar">
  <a href="index.html">← Back to social hub</a>
  <select id="dateSelect" class="hidden"></select>
  <button class="btn" id="downloadBtn" disabled>Download image</button>
</div>

<div class="poster-scale-wrap" id="posterWrap">
  <div class="poster" id="posterFrame">
    <div class="poster-brand">
      <img src="../assets/logo.png" alt="Market Cross Darts League">
      <div class="name">Market Cross Darts League</div>
      <div class="season">2026/27 Season</div>
    </div>
    <div class="poster-card-wrap">
      <div class="poster-card">
        <div class="card-header">
          <div class="league">Upcoming Fixtures</div>
          <h2 id="cardSub">Loading…</h2>
        </div>
        <div class="card-body" id="cardBody"><p class="empty">Loading…</p></div>
      </div>
    </div>
    <div class="poster-footer">marketcrossdarts.uk</div>
  </div>
</div>

<script src="../assets/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function diffDays(fromISO, toISO) {
  return Math.round((new Date(toISO + 'T00:00:00') - new Date(fromISO + 'T00:00:00')) / 86400000);
}

let DATE_GROUPS = [];

function renderDate(group) {
  document.getElementById('cardSub').textContent = group ? group.date : 'Nothing scheduled';
  const body = document.getElementById('cardBody');
  body.innerHTML = (group && group.fixtures.length)
    ? group.fixtures.map(f => `
      <div class="row">
        <div class="teams">${escapeHtml(f.homeTeam)} v ${escapeHtml(f.awayTeam)}</div>
        ${f.competition && f.competition !== 'League' ? `<div class="date">${escapeHtml(f.competition)}</div>` : ''}
      </div>`).join('')
    : '<p class="empty">No fixtures to show.</p>';
}

loadLeagueData().then(data => {
  const upcoming = data.fixtures.filter(f => f.status !== 'Submitted');
  DATE_GROUPS = groupFixturesByDate(upcoming).sort((a, b) => a.dateISO.localeCompare(b.dateISO));

  const sel = document.getElementById('dateSelect');
  if (DATE_GROUPS.length) {
    sel.classList.remove('hidden');
    sel.innerHTML = DATE_GROUPS.map((g, i) => `<option value="${i}">${escapeHtml(g.date)}</option>`).join('');
    // Defaults to the next date on or after today — "what's coming up next" — but the
    // dropdown lets you pick any further-ahead match night to see fixtures in advance.
    let defaultIdx = DATE_GROUPS.findIndex(g => diffDays(data.today, g.dateISO) >= 0);
    if (defaultIdx === -1) defaultIdx = DATE_GROUPS.length - 1;
    sel.value = defaultIdx;
    sel.addEventListener('change', () => renderDate(DATE_GROUPS[Number(sel.value)]));
    renderDate(DATE_GROUPS[defaultIdx]);
  } else {
    sel.classList.add('hidden');
    renderDate(null);
  }

  document.getElementById('downloadBtn').disabled = false;
}).catch(showPageError);

fitPosterFrame('posterFrame', 'posterWrap');
window.addEventListener('resize', () => fitPosterFrame('posterFrame', 'posterWrap'));

document.getElementById('downloadBtn').addEventListener('click', function () {
  downloadPosterFrame('posterFrame', 'mcdl-upcoming-fixtures.png', this);
});
</script>
</body>
</html>
