<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — Market Cross Darts League</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="inner">
    <h1><a href="index.html">Market Cross Darts League</a></h1>
    <div class="tagline">News, fixtures, results &amp; the league table</div>
    <nav class="site">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures &amp; Results</a>
      <a href="players.html">Player Stats</a>
      <a href="teams.html" class="current">Teams</a>
      <a href="honours.html">Previous Winners</a>
      <a href="contacts.html">Contacts</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="err-banner" id="errBanner"></div>
  <a class="backline" href="teams.html">← All teams</a>
  <div id="content"><p class="loading">Loading…</p></div>
</div>

<footer class="site">Market Cross Darts League — data updates automatically from the league's results sheet.</footer>

<script src="assets/data.js"></script>
<script>
const teamName = new URLSearchParams(location.search).get('name');

loadLeagueData().then(data => {
  if (!teamName || !data.teams.includes(teamName)) {
    document.getElementById('content').innerHTML = '<div class="card"><p class="empty">Couldn\'t find that team.</p></div>';
    return;
  }
  render(data);
}).catch(showPageError);

function render(data) {
  const roster = (data.rosters[teamName] || []);
  const teamFixtures = data.fixtures.filter(f => f.homeTeam === teamName || f.awayTeam === teamName);
  const { results, upcoming } = splitFixtures(teamFixtures);

  // League table now comes split by division (data.divisions), so find the team's
  // own division first, then its row within that division's table. A team can also
  // show up in the separate cup group-stage table (data.cup), so show that as its
  // own small table underneath when it applies, rather than picking just one.
  const division = (data.teamDivisions || {})[teamName] || '';
  const divisionEntry = (data.divisions || []).find(d => d.name === division);
  const tableRow = divisionEntry ? divisionEntry.table.find(t => t.team === teamName) : null;
  const cupRow = data.cup && data.cup.table ? data.cup.table.find(t => t.team === teamName) : null;

  let html = `<h2 class="page-title">${escapeHtml(teamName)}</h2>`;
  if (division) html += `<p class="page-sub">${escapeHtml(division)}</p>`;

  function statsTable(title, row) {
    return `<h2 class="section-title">${escapeHtml(title)}</h2><div class="card">
      <table class="data">
        <thead><tr><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">Pts</th><th class="num">Game +/-</th></tr></thead>
        <tbody><tr>
          <td class="num">${row.played}</td><td class="num">${row.won}</td><td class="num">${row.lost}</td>
          <td class="num">${row.points}</td><td class="num">${row.gameDiff > 0 ? '+' : ''}${row.gameDiff}</td>
        </tr></tbody>
      </table>
    </div>`;
  }

  if (tableRow) html += statsTable(division || 'League table', tableRow);
  if (cupRow) html += statsTable('Cup', cupRow);

  html += `<h2 class="section-title">Squad</h2><div class="card">`;
  html += roster.length
    ? `<p>${roster.map(escapeHtml).join(', ')}</p>`
    : `<p class="empty">No players registered yet.</p>`;
  html += `</div>`;

  html += `<h2 class="section-title">Results</h2><div class="card" id="resultsBox">`;
  html += results.length ? results.map(f => rowHtml(f)).join('') : `<p class="empty">No results yet.</p>`;
  html += `</div>`;

  html += `<h2 class="section-title">Upcoming fixtures</h2><div class="card" id="upcomingBox">`;
  html += upcoming.length ? upcoming.map(f => rowHtml(f)).join('') : `<p class="empty">No fixtures scheduled.</p>`;
  html += `</div>`;

  document.getElementById('content').innerHTML = html;
}

function rowHtml(f) {
  const opponent = f.homeTeam === teamName ? f.awayTeam : f.homeTeam;
  const venue = f.homeTeam === teamName ? 'Home' : 'Away';
  let right;
  if (f.status === 'Submitted') {
    const us = f.homeTeam === teamName ? f.homePoints : f.awayPoints;
    const them = f.homeTeam === teamName ? f.awayPoints : f.homePoints;
    right = `<span class="result">${us}–${them}</span>`;
  } else {
    const s = statusLabel(f.status);
    right = `<span class="status-tag ${s.cls}">${s.text}</span>`;
  }
  return `
    <a class="fixture-row" style="text-decoration:none; color:inherit;" href="fixture.html?id=${encodeURIComponent(f.fixtureId)}">
      <div>
        <div class="teams">${venue} v ${escapeHtml(opponent)} ${f.competition ? `<span class="chip brand">${escapeHtml(f.competition)}</span>` : ''}</div>
        <div class="date">${escapeHtml(f.date)}</div>
      </div>
      ${right}
    </a>`;
}
</script>
</body>
</html>
