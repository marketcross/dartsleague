<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts — Market Cross Darts League</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site" id="site-header"></header>
<script src="assets/site-chrome.js"></script>

<div class="wrap">
  <div class="err-banner" id="errBanner"></div>
  <h2 class="page-title">Contacts</h2>
  <p class="page-sub">Get in touch about fixtures, results or anything else.</p>

  <h2 class="section-title" style="margin-top:0;">Committee</h2>
  <div class="card" id="committeeSection"><p class="loading">Loading…</p></div>

  <h2 class="section-title">Team Contacts</h2>
  <p class="page-sub" style="margin-top:-8px;">Each team's captain and home venue.</p>
  <div class="card table-scroll" id="teamContactsSection"><p class="loading">Loading…</p></div>
</div>

<footer class="site" id="site-footer"></footer>

<script src="assets/data.js"></script>
<script>
loadLeagueData().then(data => {
  renderCommittee(data.committee || []);
  renderTeamContacts(data.teamContacts || []);
}).catch(showPageError);

function renderCommittee(committee) {
  const el = document.getElementById('committeeSection');
  if (!committee.length) {
    el.innerHTML = '<p class="empty">No committee contacts added yet.</p>';
    return;
  }
  el.innerHTML = committee.map(c => `
    <div class="contact-row">
      <div>
        ${c.role ? `<div class="role">${escapeHtml(c.role)}</div>` : ''}
        <div class="name">${escapeHtml(c.name)}</div>
      </div>
      <div class="details">
        ${c.email ? `<a href="mailto:${encodeURIComponent(c.email)}">${escapeHtml(c.email)}</a>` : ''}
        ${c.phone ? `<div>${escapeHtml(c.phone)}</div>` : ''}
      </div>
    </div>`).join('');
}

function renderTeamContacts(teamContacts) {
  const el = document.getElementById('teamContactsSection');
  if (!teamContacts.length) {
    el.innerHTML = '<p class="empty">No team contacts added yet.</p>';
    return;
  }
  el.innerHTML = `<table class="data">
    <thead><tr><th>Team</th><th>Captain</th><th>Venue Address</th></tr></thead>
    <tbody>
      ${teamContacts.map(t => `
      <tr>
        <td><a href="team.html?name=${teamParam(t.team)}"><strong>${escapeHtml(t.team)}</strong></a></td>
        <td>${t.captain ? escapeHtml(t.captain) : '—'}</td>
        <td>${t.venueAddress ? escapeHtml(t.venueAddress) : '—'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}
</script>
</body>
</html>
